<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>v2.9.0 | AVA 豐盛導航系統</title>
    <style>
        :root { --primary: #0056b3; --medical: #0b7285; --danger: #e74c3c; --purple: #9b59b6; }
        body { font-family: 'Noto Sans TC', sans-serif; background: #f8f9fa; padding-top: 50px; }
        .app-header { position: fixed; top: 0; width: 100%; height: 50px; background: #0A3D91; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; z-index: 1000; }
        .container { max-width: 1000px; margin: 0 auto; padding: 15px; }
        .page { display: none; background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .page.active { display: block; }
        .table-responsive { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { padding: 10px; text-align: right; border-bottom: 1px solid #edf2f7; }
        .c-red { color: var(--danger); font-weight: bold; }
        .c-purple { color: var(--purple); font-weight: 900; }
        .mini-toggle { cursor: pointer; background: #e74c3c; color: white; border-radius: 50%; width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.7rem; font-family: monospace; }
        .mini-help { cursor: pointer; background: #3498db; color: white; border-radius: 50%; width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.7rem; font-family: monospace; }
        .col-actual { display: none; }
        .show-actual .col-actual { display: table-cell; background: #fffaf0; }
        .formula-box { display: none; background: #f1f5f9; padding: 10px; font-size: 0.8rem; border-left: 3px solid var(--purple); color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <header class="app-header">v2.9.0 | AVA 豐盛導航系統</header>
    <div class="container">
        <div id="saving-page" class="page active">
            <h2>🌸 豐盛人生規劃</h2>
            <div id="saving-table-container" class="table-responsive">
                <table>
                    <thead><tr><th>年度</th><th>年金</th><th>累計年金</th><th>結餘</th></tr></thead>
                    <tbody id="saving-table-body"></tbody>
                </table>
            </div>
        </div>
        <div id="medical-page" class="page">
            <h2>🩺 退休醫保防線</h2>
            <select id="med-excel-plan-dropdown">
                <option value="尊顯0自付額">👑 尊顯0自付額</option>
                <option value="睿選8800自付額">🛡️ 睿選8800自付額</option>
            </select>
            <div class="table-responsive">
                <table id="medical-table" class="med-table">
                    <thead><tr><th>年齡</th><th>預計保費</th><th>減輕壓力</th><th class="col-actual">實繳保費</th><th>結餘</th></tr></thead>
                    <tbody id="medical-table-body"></tbody>
                </table>
            </div>
            <div class="actuarial-card">
                <div>🔴 沒有提前預備下總付出: <span id="calc-outcome-a">-$0</span></div>
                <div style="margin-top:10px;">
                    <span class="mini-help" id="toggle-formula-btn">?</span> 🔮 提前預備下淨結餘: <span id="calc-outcome-b">$0</span>
                    <div id="formula-box" class="formula-box">公式：(提取年金累計 + 防線結餘 - 累計實繳 - 本金)</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 你的 Google Sheet IDs
        const SAVING_SHEET_ID = '1-QG1tnH0iTYLAzweJ6Gvj5JDN5p1YKIq9IONyvVIo4U';
        const MEDICAL_SHEET_ID = '1G6JirabWJPrTtsdPuzzfyo-D-EPIbbdCM3HvFUW7ZCw';

        // 顯示/隱藏實繳邏輯
        document.addEventListener('click', (e) => {
            if (e.target.id === 'toggle-med-cols-btn') {
                document.getElementById('medical-table').classList.toggle('show-actual');
            }
            if (e.target.id === 'toggle-formula-btn') {
                const f = document.getElementById('formula-box');
                f.style.display = (f.style.display === 'block') ? 'none' : 'block';
            }
        });

        // 簡化版的渲染函數，之後只需透過 fetchGoogleSheet 讀取你分頁數據即可
        console.log("v2.9.0 引擎已啟動，準備連結雲端數據");
    </script>
</body>
</html>
